version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/app:cached
    working_dir: /workspaces/app
    command: bash -c "bundle install && rails db:prepare && rails server -b 0.0.0.0"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/1
      - RAILS_ENV=development

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
